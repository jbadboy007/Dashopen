name: Build Custom OpenDash APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Ensure APK is signed
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(ls build/app/outputs/flutter-apk/*.apk | head -n 1)
          fi
          TOOLS_DIR=$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)")
          OUT="build/app/outputs/flutter-apk/opendash-custom.apk"
          if "$TOOLS_DIR/apksigner" verify "$APK" >/dev/null 2>&1; then
            cp "$APK" "$OUT"
          else
            keytool -genkeypair -v \
              -keystore custom.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias opendash \
              -storepass opendash123 -keypass opendash123 \
              -dname "CN=OpenDash Custom, OU=Custom, O=OpenDash, L=Local, ST=Local, C=IN"
            "$TOOLS_DIR/zipalign" -p -f 4 "$APK" aligned.apk
            "$TOOLS_DIR/apksigner" sign \
              --ks custom.jks \
              --ks-key-alias opendash \
              --ks-pass pass:opendash123 \
              --key-pass pass:opendash123 \
              --out "$OUT" \
              aligned.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendash-custom-themes-apk
          path: build/app/outputs/flutter-apk/opendash-custom.apk
